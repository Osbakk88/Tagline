<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tagline er en enkel helseapp som hjelper deg å holde oversikt over avtaler, notater, dokumenter og medisiner på ett sted."
    />
    <title>Tagline - Simple Health Logistics</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="landing-page">
    <div class="landing-lang">
      <button class="lang-toggle" aria-label="Switch Language">NO</button>
    </div>
    <div class="container landing-shell">
      <header class="landing-header">
        <div class="brand landing-brand">
          <img src="assets/logo-icon.svg" alt="" width="64" height="64" />
          <span class="brand__text landing-brand-text">
            <span class="brand__name" data-i18n="app.title">Tagline</span>
            <span class="brand__tagline" data-i18n="app.slogan"
              >Alt samlet. Ett sted.</span
            >
          </span>
        </div>
        <p class="landing-subtitle" data-i18n="index.subtitle">
          A calm, simple way to manage health appointments and notes.
        </p>
      </header>

      <main class="landing-main">
        <div class="card landing-card">
          <h2 data-i18n="index.welcome">Welcome</h2>
          <p data-i18n="index.description" class="landing-description">
            Tagline helps you keep track of appointments, notes, and documents
            without the stress. No clutter, just what you need.
          </p>
          <div>
            <a href="dashboard.html" class="btn landing-cta"
              ><i class="fa-solid fa-arrow-right-to-bracket"></i>
              <span data-i18n="index.open">Open My List</span></a
            >
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
