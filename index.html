<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Huskelista - Simple Health Logistics</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <header
        style="text-align: center; border: none; margin-top: var(--space-xl)"
      >
        <h1 data-i18n="app.title">Huskelista</h1>
        <p
          style="
            margin: 0 auto;
            font-size: 1.25rem;
            color: var(--color-text-muted);
          "
          data-i18n="index.subtitle"
        >
          A calm, simple way to manage health appointments and notes.
        </p>
      </header>

      <main style="text-align: center; margin-top: var(--space-xl)">
        <div class="card" style="max-width: 600px; margin: 0 auto">
          <h2 data-i18n="index.welcome">Welcome</h2>
          <p data-i18n="index.description">
            Huskelista helps you keep track of appointments, notes, and
            documents without the stress. No clutter, just what you need.
          </p>
          <div style="margin-top: var(--space-lg)">
            <a href="dashboard.html" class="btn" data-i18n="index.open"
              >Open My List</a
            >
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
