<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="app.title">Tagline</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <div class="header-top">
          <a class="brand" href="index.html" aria-label="Tagline home">
            <img src="assets/logo-icon.svg" alt="" width="32" height="32" />
            <span class="brand__text">
                <span class="brand__name" data-i18n="app.title">Tagline</span>
                <span class="brand__tagline" data-i18n="app.slogan">Alt samlet. Ett sted.</span>
            </span>
          </a>
          <button class="hamburger" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
        <nav>
          <ul>
            <li>
              <a href="dashboard.html" data-i18n="nav.dashboard">Dashboard</a>
            </li>
            <li>
              <a href="appointments.html" data-i18n="nav.appointments"
                >Appointments</a
              >
            </li>
            <li>
              <a href="medications.html" data-i18n="nav.medications"
                >Medications</a
              >
            </li>
            <li>
              <a href="symptoms.html" data-i18n="nav.symptoms">Symptoms</a>
            </li>
            <li><a href="vitals.html" data-i18n="nav.vitals">Vitals</a></li>
            <li>
              <a href="contacts.html" data-i18n="nav.contacts">Contacts</a>
            </li>
            <li><a href="notes.html" data-i18n="nav.notes">Notes</a></li>
            <li>
              <a href="documents.html" data-i18n="nav.documents">Documents</a>
            </li>
            <li><a href="report.html" data-i18n="nav.report">Report</a></li>
            <li>
              <a href="profile.html" class="active" data-i18n="nav.profile"
                >Profile</a
              >
            </li>
            <li>
              <a href="settings.html" data-i18n="nav.settings">Settings</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">
      <h2 data-i18n="nav.profile">Profile</h2>
      <section class="card">
        <h2 data-i18n="profile.personal_info">Personal Information</h2>
        <form id="profile-form">
          <label for="name" data-i18n="profile.label.name">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="e.g. Ola Nordmann"
            data-i18n-placeholder="profile.placeholder.name"
          />

          <div
            style="
              display: grid;
              grid-template-columns: 1fr 1fr;
              gap: var(--space-md);
            "
          >
            <div>
              <label for="dob" data-i18n="profile.label.dob"
                >Date of Birth</label
              >
              <input type="date" id="dob" name="dob" />
            </div>
            <div>
              <label for="bloodType" data-i18n="profile.label.blood_type"
                >Blood Type</label
              >
              <select id="bloodType" name="bloodType">
                <option value="">-</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
              </select>
            </div>
          </div>

          <label for="allergies" data-i18n="profile.label.allergies"
            >Allergies / Medical Conditions</label
          >
          <textarea
            id="allergies"
            name="allergies"
            rows="3"
            placeholder="e.g. Penicillin, Peanuts..."
            data-i18n-placeholder="profile.placeholder.allergies"
          ></textarea>

          <h3
            style="margin-top: var(--space-lg); margin-bottom: var(--space-sm)"
            data-i18n="profile.emergency_contact"
          >
            Emergency Contact
          </h3>

          <label for="emergencyName" data-i18n="profile.label.emergency_name"
            >Contact Name</label
          >
          <input
            type="text"
            id="emergencyName"
            name="emergencyName"
            placeholder="e.g. Kari Nordmann"
            data-i18n-placeholder="profile.placeholder.emergency_name"
          />

          <label for="emergencyPhone" data-i18n="profile.label.emergency_phone"
            >Contact Phone</label
          >
          <input
            type="tel"
            id="emergencyPhone"
            name="emergencyPhone"
            placeholder="123 45 678"
            data-i18n-placeholder="profile.placeholder.emergency_phone"
          />

          <div style="margin-top: var(--space-md); text-align: right">
            <span
              id="save-message"
              style="
                color: var(--color-primary);
                margin-right: var(--space-sm);
                opacity: 0;
                transition: opacity 0.3s;
              "
              >Saved!</span
            >
            <button type="submit" class="btn" data-i18n="btn.save">
              Save Profile
            </button>
          </div>
        </form>
      </section>
    </main>

    <script type="module">
      import { Profile } from "./js/modules/profile.js";
      import { I18n } from "./js/modules/i18n.js";

      const form = document.getElementById("profile-form");
      const msg = document.getElementById("save-message");

      function load() {
        const data = Profile.get();
        document.getElementById("name").value = data.name || "";
        document.getElementById("dob").value = data.dob || "";
        document.getElementById("bloodType").value = data.bloodType || "";
        document.getElementById("allergies").value = data.allergies || "";
        document.getElementById("emergencyName").value =
          data.emergencyName || "";
        document.getElementById("emergencyPhone").value =
          data.emergencyPhone || "";
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        Profile.save({
          name: document.getElementById("name").value,
          dob: document.getElementById("dob").value,
          bloodType: document.getElementById("bloodType").value,
          allergies: document.getElementById("allergies").value,
          emergencyName: document.getElementById("emergencyName").value,
          emergencyPhone: document.getElementById("emergencyPhone").value,
        });

        msg.style.opacity = "1";
        msg.textContent = I18n.get("profile.saved");
        setTimeout(() => {
          msg.style.opacity = "0";
        }, 2000);
      });

      // Re-render when language changes (though form values stay)
      window.addEventListener("languageChanged", () => {
        // No specific render logic needed as I18n.apply() handles text
      });

      load();
    </script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
