<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Skriv og organiser helsenotater i Tagline, slik at viktig informasjon er lett tilgjengelig."
    />
    <title>Notes - Tagline</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <div class="header-top">
          <a class="brand" href="index.html" aria-label="Tagline home">
            <img src="assets/logo-icon.svg" alt="" width="32" height="32" />
            <span class="brand__text">
              <span class="brand__name" data-i18n="app.title">Tagline</span>
              <span class="brand__tagline" data-i18n="app.slogan"
                >Alt samlet. Ett sted.</span
              >
            </span>
          </a>
          <div class="header-controls">
            <button class="lang-toggle" aria-label="Switch Language">NO</button>
            <button
              class="hamburger"
              aria-label="Menu"
              aria-controls="primary-nav"
              aria-expanded="false"
              aria-haspopup="true"
            >
              <span></span>
              <span></span>
              <span></span>
            </button>
          </div>
        </div>
        <nav id="primary-nav">
          <ul>
            <li>
              <a href="dashboard.html">
                <i class="fa-solid fa-house"></i>
                <span data-i18n="nav.dashboard">Dashboard</span>
              </a>
            </li>
            <li>
              <a href="appointments.html">
                <i class="fa-solid fa-calendar-check"></i>
                <span data-i18n="nav.appointments">Appointments</span>
              </a>
            </li>
            <li>
              <a href="medications.html">
                <i class="fa-solid fa-pills"></i>
                <span data-i18n="nav.medications">Medications</span>
              </a>
            </li>
            <li>
              <a href="symptoms.html">
                <i class="fa-solid fa-clipboard-user"></i>
                <span data-i18n="nav.symptoms">Symptoms</span>
              </a>
            </li>
            <li>
              <a href="vitals.html">
                <i class="fa-solid fa-heart-pulse"></i>
                <span data-i18n="nav.vitals">Vitals</span>
              </a>
            </li>
            <li>
              <a href="contacts.html">
                <i class="fa-solid fa-user-doctor"></i>
                <span data-i18n="nav.contacts">Contacts</span>
              </a>
            </li>
            <li>
              <a href="notes.html" class="active">
                <i class="fa-solid fa-note-sticky"></i>
                <span data-i18n="nav.notes">Notes</span>
              </a>
            </li>
            <li>
              <a href="documents.html">
                <i class="fa-solid fa-file-medical"></i>
                <span data-i18n="nav.documents">Documents</span>
              </a>
            </li>
            <li>
              <a href="report.html">
                <i class="fa-solid fa-chart-simple"></i>
                <span data-i18n="nav.report">Report</span>
              </a>
            </li>
            <li>
              <a href="profile.html">
                <i class="fa-solid fa-user"></i>
                <span data-i18n="nav.profile">Profile</span>
              </a>
            </li>
            <li>
              <a href="settings.html">
                <i class="fa-solid fa-gear"></i>
                <span data-i18n="nav.settings">Settings</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">
      <h2 data-i18n="nav.notes">Notes</h2>
      <section class="card">
        <h2 data-i18n="notes.add_new">Add New Note</h2>
        <form id="add-note-form">
          <label for="content" data-i18n="notes.label.content"
            >Note Content</label
          >
          <textarea
            id="content"
            name="content"
            rows="5"
            required
            placeholder="Write your note here..."
            data-i18n-placeholder="notes.placeholder.content"
          ></textarea>
          <button type="submit" class="btn" data-i18n="notes.btn.save">
            Save Note
          </button>
        </form>
      </section>

      <section>
        <h2 data-i18n="notes.my_notes">My Notes</h2>
        <div id="notes-list">
          <!-- List will be populated here -->
        </div>
      </section>
    </main>

    <script type="module">
      import { Notes } from "./js/modules/notes.js";
      import { I18n } from "./js/modules/i18n.js";

      const form = document.getElementById("add-note-form");
      const list = document.getElementById("notes-list");

      function render() {
        const notes = Notes.getAll();
        if (notes.length === 0) {
          list.innerHTML = `<p>${I18n.get("notes.none")}</p>`;
          return;
        }

        list.innerHTML = notes
          .map(
            (note) => `
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: start;">
                        <div style="flex-grow: 1; margin-right: var(--space-md);">
                            <p style="white-space: pre-wrap;">${
                              note.content
                            }</p>
                            <small style="color: var(--color-text-muted);">Added: ${new Date(
                              note.createdAt,
                            ).toLocaleString()}</small>
                        </div>
                        <button class="btn btn--secondary" onclick="window.deleteNote('${
                          note.id
                        }')" aria-label="Delete note">${I18n.get(
                          "btn.delete",
                        )}</button>
                    </div>
                </div>
            `,
          )
          .join("");
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        Notes.add({
          content: formData.get("content"),
        });
        form.reset();
        render();
      });

      window.deleteNote = (id) => {
        if (confirm(I18n.get("notes.confirm_delete"))) {
          Notes.delete(id);
          render();
        }
      };

      render();
    </script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
