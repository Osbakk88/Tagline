<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medications - Tagline</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <div class="header-top">
          <a class="brand" href="index.html" aria-label="Tagline home">
            <img src="assets/logo-icon.svg" alt="" width="32" height="32" />
            <span class="brand__text">
                <span class="brand__name" data-i18n="app.title">Tagline</span>
                <span class="brand__tagline" data-i18n="app.slogan">Alt samlet. Ett sted.</span>
            </span>
          </a>
          <div class="header-controls">
            <button class="lang-toggle" aria-label="Switch Language">NO</button>
            <button class="hamburger" aria-label="Menu" aria-controls="primary-nav" aria-expanded="false" aria-haspopup="true">
              <span></span>
              <span></span>
              <span></span>
            </button>
          </div>
        </div>
        <nav id="primary-nav">
          <ul>
            <li>
              <a href="dashboard.html">
                <i class="fa-solid fa-house"></i> <span data-i18n="nav.dashboard">Dashboard</span>
              </a>
            </li>
            <li>
              <a href="appointments.html">
                <i class="fa-solid fa-calendar-check"></i> <span data-i18n="nav.appointments">Appointments</span>
              </a>
            </li>
            <li>
              <a href="medications.html" class="active">
                <i class="fa-solid fa-pills"></i> <span data-i18n="nav.medications">Medications</span>
              </a>
            </li>
            <li>
              <a href="symptoms.html">
                <i class="fa-solid fa-clipboard-user"></i> <span data-i18n="nav.symptoms">Symptoms</span>
              </a>
            </li>
            <li>
              <a href="vitals.html">
                <i class="fa-solid fa-heart-pulse"></i> <span data-i18n="nav.vitals">Vitals</span>
              </a>
            </li>
            <li>
              <a href="contacts.html">
                <i class="fa-solid fa-user-doctor"></i> <span data-i18n="nav.contacts">Contacts</span>
              </a>
            </li>
            <li>
              <a href="notes.html">
                <i class="fa-solid fa-note-sticky"></i> <span data-i18n="nav.notes">Notes</span>
              </a>
            </li>
            <li>
              <a href="documents.html">
                <i class="fa-solid fa-file-medical"></i> <span data-i18n="nav.documents">Documents</span>
              </a>
            </li>
            <li>
              <a href="report.html">
                <i class="fa-solid fa-chart-simple"></i> <span data-i18n="nav.report">Report</span>
              </a>
            </li>
            <li>
              <a href="profile.html">
                <i class="fa-solid fa-user"></i> <span data-i18n="nav.profile">Profile</span>
              </a>
            </li>
            <li>
              <a href="settings.html">
                <i class="fa-solid fa-gear"></i> <span data-i18n="nav.settings">Settings</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">
      <h2 data-i18n="nav.medications">Medications</h2>
      <section class="card">
        <h2 data-i18n="medications.add_new">Add Medication</h2>
        <form id="add-medication-form">
          <label for="name" data-i18n="medications.label.name"
            >Medication Name</label
          >
          <input
            type="text"
            id="name"
            name="name"
            required
            placeholder="e.g. Paracetamol"
            data-i18n-placeholder="medications.placeholder.name"
          />

          <label for="schedule" data-i18n="medications.label.schedule"
            >Schedule</label
          >
          <select id="schedule" name="schedule">
            <option value="morning" data-i18n="medications.schedule.morning">
              Morning
            </option>
            <option value="evening" data-i18n="medications.schedule.evening">
              Evening
            </option>
            <option value="daily" data-i18n="medications.schedule.daily">
              Daily (Morning & Evening)
            </option>
            <option value="needed" data-i18n="medications.schedule.needed">
              As Needed
            </option>
          </select>

          <div style="margin-bottom: var(--space-md)">
            <label
              style="display: flex; align-items: center; gap: var(--space-sm)"
            >
              <input
                type="checkbox"
                id="reminder"
                name="reminder"
                style="width: auto; margin-bottom: 0"
              />
              <span data-i18n="medications.label.reminder"
                >Enable Reminder (Visual only)</span
              >
            </label>
          </div>

          <button type="submit" class="btn" data-i18n="medications.btn.add">
            Add Medication
          </button>
        </form>
      </section>

      <section>
        <h2 data-i18n="medications.my_meds">My Medications</h2>
        <div id="medications-list">
          <!-- List will be populated here -->
        </div>
      </section>
    </main>

    <script type="module">
      import { Medications } from "./js/modules/medications.js";
      import { I18n } from "./js/modules/i18n.js";

      const form = document.getElementById("add-medication-form");
      const list = document.getElementById("medications-list");

      function render() {
        const meds = Medications.getAll();
        if (meds.length === 0) {
          list.innerHTML = `<p>${I18n.get("medications.none")}</p>`;
          return;
        }

        list.innerHTML = meds
          .map(
            (med) => `
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <h3>${med.name}</h3>
                            <p><strong>${I18n.get(
                              "medications.label.schedule"
                            )}:</strong> ${I18n.get(
              "medications.schedule." + med.schedule
            )}</p>
                            ${
                              med.reminder
                                ? `<p style="color: var(--color-primary); font-size: 0.9rem;">${I18n.get(
                                    "medications.reminder_active"
                                  )}</p>`
                                : ""
                            }
                        </div>
                        <button class="btn btn--secondary" onclick="window.deleteMedication('${
                          med.id
                        }')" aria-label="Delete medication">${I18n.get(
              "btn.delete"
            )}</button>
                    </div>
                </div>
            `
          )
          .join("");
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        Medications.add({
          name: formData.get("name"),
          schedule: formData.get("schedule"),
          reminder: formData.get("reminder") === "on",
        });
        form.reset();
        render();
      });

      window.deleteMedication = (id) => {
        if (confirm(I18n.get("medications.confirm_delete"))) {
          Medications.delete(id);
          render();
        }
      };

      render();
    </script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
